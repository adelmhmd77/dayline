<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dayline — تسجيل الدخول</title>
  <link rel="stylesheet" href="css/shared.css">
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login-card { width: 100%; max-width: 380px; }
    .login-card h1 { margin: 0 0 20px; text-align: center; }
    .login-card .btn { width: 100%; }
    .switch { display: block; margin-top: 14px; text-align: center; background: none; border: 0; color: var(--primary); cursor: pointer; font: inherit; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form id="loginForm" class="card login-card" novalidate>
      <h1>Dayline</h1>
      <div class="field">
        <label for="email">الإيميل</label>
        <input type="email" id="email" class="input" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" class="input" autocomplete="current-password" required>
      </div>
      <p class="error-text" id="loginError"></p>
      <button type="submit" id="submitBtn" class="btn btn-primary">دخول</button>
      <button type="button" id="switchBtn" class="switch">إنشاء حساب جديد</button>
    </form>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
